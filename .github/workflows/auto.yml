name: Randomized Auto Commit

on:
  schedule:
    - cron: '0 */6 * * *'   # checks 4x a day
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip weekends
        id: weekend
        run: |
          day=$(date +%u)
          if [ "$day" -ge 6 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Randomly decide whether to commit
        id: decision
        if: steps.weekend.outputs.skip == 'false'
        run: |
          if [ $((RANDOM % 100)) -lt 40 ]; then
            echo "should_commit=true" >> $GITHUB_OUTPUT
          else
            echo "should_commit=false" >> $GITHUB_OUTPUT
          fi

      - name: Random sleep
        if: steps.decision.outputs.should_commit == 'true'
        run: sleep $((RANDOM % 3600))

      - name: Update log file
        if: steps.decision.outputs.should_commit == 'true'
        run: echo "$(date '+%Y-%m-%d %H:%M:%S')" >> activity_log.txt

      - name: Commit and push
        if: steps.decision.outputs.should_commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add activity_log.txt
          git commit -m "Update activity log" || echo "Nothing to commit"
          git push